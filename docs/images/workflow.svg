<text x="484" y="382" font-size="12" fill="#58685f">05</text>
<text x="484" y="414" font-size="20" font-weight="600">VERIFY</text>
<text x="484" y="446" font-size="14" fill="#58685f">Preview, repair, and regress.</text>
<rect x="48" y="350" width="356" height="126" rx="12" fill="white" stroke="#dce2d5"/>
<text x="70" y="382" font-size="12" fill="#58685f">06</text>
<text x="70" y="414" font-size="20" font-weight="600">DELIVER</text>
<text x="70" y="446" font-size="14" fill="#58685f">Source, entry points, and evidence.</text>
