<text x="70" y="260" font-size="14" fill="#58685f">Reuse answers. Inspect facts.</text>
<rect x="462" y="164" width="356" height="126" rx="12" fill="white" stroke="#dce2d5"/>
<text x="484" y="196" font-size="12" fill="#58685f">02</text>
<text x="484" y="228" font-size="20" font-weight="600">PLAN</text>
<text x="484" y="260" font-size="14" fill="#58685f">Deliver the complete project plan.</text>
<rect x="876" y="164" width="356" height="126" rx="12" fill="white" stroke="#dce2d5"/>
<text x="898" y="196" font-size="12" fill="#58685f">03</text>
<text x="898" y="228" font-size="20" font-weight="600">DESIGN</text>
<text x="898" y="260" font-size="14" fill="#58685f">Resolve the client’s visual and task needs.</text>
<rect x="876" y="350" width="356" height="126" rx="12" fill="white" stroke="#dce2d5"/>
<text x="898" y="382" font-size="12" fill="#58685f">04</text>
<text x="898" y="414" font-size="20" font-weight="600">BUILD</text>
<text x="898" y="446" font-size="14" fill="#58685f">Connect one complete business flow.</text>
