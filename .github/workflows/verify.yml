name: Verify
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_repository.py
  example:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/sensu-enterprise
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: examples/sensu-enterprise/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run setup
      - run: npm run build
      - name: Verify production HTTP routes
        run: |
          npm start > /tmp/sensu-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4319/ > /dev/null; then break; fi
            sleep 0.25
          done
          npm run verify:http
